<?xml version="1.0" encoding="ISO-8859-1" ?>
<!DOCTYPE html>
<html lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

  <f:metadata>
    <f:viewAction action="#{mainController.loadData()}" phase="UPDATE_MODEL_VALUES" />
  </f:metadata>

  <h:head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>#{uiconsts['viewTitle']}</title>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous" />
    <link href="https://use.fontawesome.com/releases/v5.12.0/css/all.css" type="text/css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://unpkg.com/bootstrap@4.5.2/dist/css/bootstrap.min.css" type="text/css" rel="stylesheet" crossorigin="anonymous" />
    <script src="https://unpkg.com/bootstrap@4.5.2/dist/js/bootstrap.min.js" crossorigin="anonymous" />
    <style>
      body { padding-bottom: 4rem; }
      .table td input { width: 100%; }
      .form-row .form-control { margin-bottom: .5rem; }
      .section-title { margin: 1.25rem 0 .75rem; }
    </style>
  </h:head>

  <h:body>
    <div class="container-fluid">
      <nav class="navbar navbar-light bg-light mb-3">
        <div class="navbar-header">
          <i class="navbar-brand fa fa-school fa-lg"></i>
          <h:outputText value="#{uiconsts['viewTitle']}" />
        </div>
        <h:panelGroup rendered="#{externalContext.userPrincipal ne null}">
          <h:form id="logout"><h:commandButton styleClass="btn btn-outline-dark" action="#{loginBean.logout()}" value="#{uiconsts['signout']}" /></h:form>
        </h:panelGroup>
      </nav>

      <h:panelGroup rendered="#{externalContext.userPrincipal eq null}">
        <h:link outcome="login" value="#{uiconsts['signin']}" styleClass="btn btn-primary" />
      </h:panelGroup>

      <h:panelGroup rendered="#{externalContext.userPrincipal ne null}">
        <h:form id="chooseOption" styleClass="mb-3">
          <h:selectOneMenu id="choose_option" styleClass="form-control" value="#{mainController.optionChosen}">
            <f:selectItems value="#{mainController.options}" />
          </h:selectOneMenu>
          <h:commandButton styleClass="btn btn-primary mt-2" value="#{uiconsts['submitLabel']}" action="#{mainController.submitForm()}" />
        </h:form>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Student Management'}">
          <h2 class="section-title">Student Management</h2>
          <h:form id="studentAdd" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{newStudent.firstName}" a:placeholder="First Name" />
            <h:inputText styleClass="form-control col" value="#{newStudent.lastName}" a:placeholder="Last Name" />
            <h:inputText styleClass="form-control col" value="#{newStudent.email}" a:placeholder="Email" />
            <h:inputText styleClass="form-control col" value="#{newStudent.phone}" a:placeholder="Phone" />
            <h:selectOneMenu styleClass="form-control col" value="#{newStudent.program}"><f:selectItems value="#{studentController.programs}" /></h:selectOneMenu>
            <h:commandButton styleClass="btn btn-success" value="Add" action="#{newStudent.addStudent()}" />
          </h:form>
          <h:form id="studentList">
            <h:dataTable value="#{studentController.students}" var="student" styleClass="table table-striped table-bordered table-hover">
              <h:column><f:facet name="header">Id</f:facet><h:outputText value="#{student.id}" /></h:column>
              <h:column><f:facet name="header">First Name</f:facet><h:inputText value="#{student.firstName}" /></h:column>
              <h:column><f:facet name="header">Last Name</f:facet><h:inputText value="#{student.lastName}" /></h:column>
              <h:column><f:facet name="header">Email</f:facet><h:inputText value="#{student.email}" /></h:column>
              <h:column><f:facet name="header">Phone</f:facet><h:inputText value="#{student.phone}" /></h:column>
              <h:column><f:facet name="header">Program</f:facet><h:inputText value="#{student.program}" /></h:column>
              <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-success" value="Save" action="#{studentController.updateStudent(student)}" /> <h:commandButton styleClass="btn btn-sm btn-danger" value="Delete" action="#{studentController.deleteStudent(student.id)}" /></h:column>
            </h:dataTable>
          </h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Course Management'}">
          <h2 class="section-title">Course Management</h2>
          <h:form id="courseAdd" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{collegeController.newCourse.courseCode}" a:placeholder="Code" />
            <h:inputText styleClass="form-control col" value="#{collegeController.newCourse.courseTitle}" a:placeholder="Title" />
            <h:inputText styleClass="form-control col" value="#{collegeController.newCourse.creditUnits}" a:placeholder="Credits" />
            <h:selectOneMenu styleClass="form-control col" value="#{collegeController.newCourse.online}"><f:selectItem itemValue="0" itemLabel="In Person" /><f:selectItem itemValue="1" itemLabel="Online" /></h:selectOneMenu>
            <h:commandButton styleClass="btn btn-success" value="Add" action="#{collegeController.addCourse()}" />
          </h:form>
          <h:form id="courseList"><h:dataTable value="#{collegeController.courses}" var="course" styleClass="table table-striped table-bordered table-hover">
            <h:column><f:facet name="header">Id</f:facet>#{course.id}</h:column>
            <h:column><f:facet name="header">Code</f:facet><h:inputText value="#{course.courseCode}" /></h:column>
            <h:column><f:facet name="header">Title</f:facet><h:inputText value="#{course.courseTitle}" /></h:column>
            <h:column><f:facet name="header">Credits</f:facet><h:inputText value="#{course.creditUnits}" /></h:column>
            <h:column><f:facet name="header">Online</f:facet><h:inputText value="#{course.online}" /></h:column>
            <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-success" value="Save" action="#{collegeController.updateCourse(course)}" /> <h:commandButton styleClass="btn btn-sm btn-danger" value="Delete" action="#{collegeController.deleteCourse(course.id)}" /></h:column>
          </h:dataTable></h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Professor Management'}">
          <h2 class="section-title">Professor Management</h2>
          <h:form id="professorAdd" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{collegeController.newProfessor.firstName}" a:placeholder="First Name" />
            <h:inputText styleClass="form-control col" value="#{collegeController.newProfessor.lastName}" a:placeholder="Last Name" />
            <h:selectOneMenu styleClass="form-control col" value="#{collegeController.newProfessor.degree}"><f:selectItems value="#{collegeController.degrees}" /></h:selectOneMenu>
            <h:commandButton styleClass="btn btn-success" value="Add" action="#{collegeController.addProfessor()}" />
          </h:form>
          <h:form id="professorList"><h:dataTable value="#{collegeController.professors}" var="professor" styleClass="table table-striped table-bordered table-hover">
            <h:column><f:facet name="header">Id</f:facet>#{professor.id}</h:column>
            <h:column><f:facet name="header">First Name</f:facet><h:inputText value="#{professor.firstName}" /></h:column>
            <h:column><f:facet name="header">Last Name</f:facet><h:inputText value="#{professor.lastName}" /></h:column>
            <h:column><f:facet name="header">Degree</f:facet><h:inputText value="#{professor.degree}" /></h:column>
            <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-success" value="Save" action="#{collegeController.updateProfessor(professor)}" /> <h:commandButton styleClass="btn btn-sm btn-danger" value="Delete" action="#{collegeController.deleteProfessor(professor.id)}" /></h:column>
          </h:dataTable></h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Student Club Management'}">
          <h2 class="section-title">Student Club Management</h2>
          <h:form id="clubAdd" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{collegeController.newStudentClub.name}" a:placeholder="Name" />
            <h:inputText styleClass="form-control col" value="#{collegeController.newStudentClub.desc}" a:placeholder="Description" />
            <label class="col-form-label mr-2">Academic</label><h:selectBooleanCheckbox value="#{collegeController.newStudentClub.academic}" />
            <h:commandButton styleClass="btn btn-success ml-3" value="Add" action="#{collegeController.addStudentClub()}" />
          </h:form>
          <h:form id="clubList"><h:dataTable value="#{collegeController.studentClubs}" var="club" styleClass="table table-striped table-bordered table-hover">
            <h:column><f:facet name="header">Id</f:facet>#{club.id}</h:column>
            <h:column><f:facet name="header">Name</f:facet><h:inputText value="#{club.name}" /></h:column>
            <h:column><f:facet name="header">Description</f:facet><h:inputText value="#{club.desc}" /></h:column>
            <h:column><f:facet name="header">Academic</f:facet>#{club.academic}</h:column>
            <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-success" value="Save" action="#{collegeController.updateStudentClub(club)}" /> <h:commandButton styleClass="btn btn-sm btn-danger" value="Delete" action="#{collegeController.deleteStudentClub(club.id)}" /></h:column>
          </h:dataTable></h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Course Registration'}">
          <h2 class="section-title">Course Registration</h2>
          <h:form id="registrationAdd" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedStudentId}" a:placeholder="Student Id" />
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedCourseId}" a:placeholder="Course Id" />
            <h:inputText styleClass="form-control col" value="#{collegeController.newRegistration.year}" a:placeholder="Year" />
            <h:selectOneMenu styleClass="form-control col" value="#{collegeController.newRegistration.semester}"><f:selectItems value="#{collegeController.semesters}" /></h:selectOneMenu>
            <h:commandButton styleClass="btn btn-success" value="Register" action="#{collegeController.addCourseRegistration()}" />
          </h:form>
          <h:form id="registrationList"><h:dataTable value="#{collegeController.courseRegistrations}" var="reg" styleClass="table table-striped table-bordered table-hover">
            <h:column><f:facet name="header">Student</f:facet>#{reg.studentId}</h:column>
            <h:column><f:facet name="header">Course</f:facet>#{reg.courseId}</h:column>
            <h:column><f:facet name="header">Professor</f:facet>#{reg.professorId}</h:column>
            <h:column><f:facet name="header">Year</f:facet>#{reg.year}</h:column>
            <h:column><f:facet name="header">Semester</f:facet>#{reg.semester}</h:column>
            <h:column><f:facet name="header">Grade</f:facet>#{reg.letterGrade}</h:column>
            <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-danger" value="Delete" action="#{collegeController.deleteCourseRegistration(reg)}" /></h:column>
          </h:dataTable></h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Assign Professor'}">
          <h2 class="section-title">Assign Professor</h2>
          <h:form id="assignProfessor" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedStudentId}" a:placeholder="Student Id" />
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedCourseId}" a:placeholder="Course Id" />
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedProfessorId}" a:placeholder="Professor Id" />
            <h:commandButton styleClass="btn btn-success" value="Assign" action="#{collegeController.assignProfessor()}" />
          </h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Assign Grade'}">
          <h2 class="section-title">Assign Grade</h2>
          <h:form id="assignGrade" styleClass="form-row">
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedStudentId}" a:placeholder="Student Id" />
            <h:inputText styleClass="form-control col" value="#{collegeController.selectedCourseId}" a:placeholder="Course Id" />
            <h:selectOneMenu styleClass="form-control col" value="#{collegeController.selectedGrade}"><f:selectItems value="#{collegeController.letterGrades}" /></h:selectOneMenu>
            <h:commandButton styleClass="btn btn-success" value="Assign" action="#{collegeController.assignGrade()}" />
          </h:form>
        </h:panelGroup>

        <h:panelGroup rendered="#{mainController.optionChosen == 'Club Membership Registration'}">
          <h2 class="section-title">Club Membership Registration</h2>
          <h:form id="clubMembership" styleClass="mb-3">
	          <h:selectOneMenu styleClass="form-control col" value="#{collegeController.selectedStudentId}">
	           <f:selectItem
			        itemLabel="-- Select Student --"
			        itemValue="-1"
			        noSelectionOption="true"/>
	          <f:selectItems value="#{studentController.students}"
	                       var="student"
	                       itemValue="#{student.id}"
	                       itemLabel="#{student.firstName} #{student.lastName}" />
	          </h:selectOneMenu>
	          <h:commandButton styleClass="btn btn-primary mt-2"  value="Submit" action="#{collegeController.loadStudentMemberships()}" />
          </h:form>
         
          
           <h:form id="RegisteredClubList">
           <h2 class="section-title">Registered Clubs</h2>
            <h:dataTable value="#{collegeController.registeredClubs}" var="club" styleClass="table table-striped table-bordered table-hover">
	            <h:column><f:facet name="header">Id</f:facet>#{club.id}</h:column>
	            <h:column><f:facet name="header">Name</f:facet><h:outputText value="#{club.name}" /></h:column>
	            <h:column><f:facet name="header">Description</f:facet><h:outputText value="#{club.desc}" /></h:column>
	            <h:column><f:facet name="header">Academic</f:facet>#{club.academic}</h:column>
              <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-danger" value="Withdraw" action="#{collegeController.deleteStudentFromClub(club.id)}" /></h:column>
            </h:dataTable>
          </h:form>
          
           <h:form id="UnRegisteredClubList">
           <h2 class="section-title">UnRegistered Clubs</h2>
            <h:dataTable value="#{collegeController.unRegisteredClubs}" var="club" styleClass="table table-striped table-bordered table-hover">
	           	<h:column><f:facet name="header">Id</f:facet>#{club.id}</h:column>
	            <h:column><f:facet name="header">Name</f:facet><h:outputText value="#{club.name}" /></h:column>
	            <h:column><f:facet name="header">Description</f:facet><h:outputText value="#{club.desc}" /></h:column>
	            <h:column><f:facet name="header">Academic</f:facet>#{club.academic}</h:column>
              <h:column><f:facet name="header">Action</f:facet><h:commandButton styleClass="btn btn-sm btn-success" value="Register" action="#{collegeController.addStudentToClub(club.id)}" /></h:column>
            </h:dataTable>
          </h:form>
          
          

        </h:panelGroup>
      </h:panelGroup>

      <footer class="footer fixed-bottom bg-light text-center">
        <h:outputText class="text-muted credit" value="Brought to you by Group 9 - CST8277 (v#{uiconsts['version']})" />
      </footer>
    </div>
  </h:body>
</html>
